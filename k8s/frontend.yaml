apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ticketflow-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:3001"
            - name: NEXT_PUBLIC_PAYMENT_URL
              value: "http://localhost:3002"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ticketflow
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
