apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: ticketflow-event-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ticketflow-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://host.docker.internal:6379"
            - name: KAFKA_BROKERS
              value: "host.docker.internal:9092"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: ticketflow
spec:
  selector:
    app: event-service
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ticketflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: ticketflow-payment-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ticketflow-secrets
                  key: DATABASE_URL
            - name: KAFKA_BROKERS
              value: "host.docker.internal:9092"
            - name: EVENT_SERVICE_URL
              value: "http://event-service:3001"
            - name: FRONTEND_ORIGIN
              value: "http://localhost:3000"
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ticketflow-secrets
                  key: RAZORPAY_KEY_ID
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: ticketflow-secrets
                  key: RAZORPAY_KEY_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ticketflow
spec:
  selector:
    app: payment-service
  ports:
    - port: 3002
      targetPort: 3002
